name: AI DevOps Agent CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:

  # ============================================================
  # JOB 1 - Python CI
  # ============================================================

  python-ci:

    name: Python CI

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv .venv

      - name: Install Python dependencies
        run: |
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python syntax check
        run: |
          . .venv/bin/activate

          python -m py_compile main.py
          python -m py_compile agent/agent.py
          python -m py_compile tools/aws.py
          python -m py_compile tools/terraform.py
          python -m py_compile test_aws.py
          python -m py_compile test_ollama.py

          echo "Python syntax check passed."

      - name: Check project structure
        run: |
          test -f main.py
          test -f agent/agent.py
          test -f tools/aws.py
          test -f tools/terraform.py
          test -f requirements.txt

          echo "Project structure check passed."


  # ============================================================
  # JOB 2 - GitHub OIDC Debug
  # ============================================================

  oidc-debug:

    name: GitHub OIDC Debug

    runs-on: ubuntu-latest

    steps:

      - name: Debug GitHub information
        run: |
          echo "=========================================="
          echo "GitHub Actions Information"
          echo "=========================================="

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Ref        : $GITHUB_REF"
          echo "Event      : $GITHUB_EVENT_NAME"
          echo "Actor      : $GITHUB_ACTOR"

          echo "=========================================="

      - name: Request GitHub OIDC token
        shell: bash
        run: |

          echo "Requesting GitHub OIDC token..."

          RESPONSE=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: Could not obtain OIDC token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "OIDC token successfully obtained."

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          case $((${#PAYLOAD} % 4)) in
            2)
              PAYLOAD="${PAYLOAD}=="
              ;;
            3)
              PAYLOAD="${PAYLOAD}="
              ;;
          esac

          echo ""
          echo "=========================================="
          echo "OIDC CLAIMS"
          echo "=========================================="

          echo "$PAYLOAD" \
            | base64 -d 2>/dev/null \
            | jq '{
                iss,
                aud,
                sub,
                repository,
                repository_owner,
                ref,
                event_name
              }'

          echo "=========================================="
